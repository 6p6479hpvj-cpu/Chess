<!doctype html>
<html lang="en" data-theme="dark" data-board="slate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChessSense AI</title>
<style>
:root{--bg:#0f1a22;--p:#16242f;--p2:#1e303d;--tx:#e7eef3;--mu:#95a9b7;--ac:#5fd0c0;--on:#06231f;--bd:#294353;--bad:#e5645f;--warn:#e9b34f;--ok:#4fc79b;color-scheme:dark}
[data-theme=light]{--bg:#eef2f5;--p:#fff;--p2:#e6edf2;--tx:#13232e;--mu:#586f7e;--ac:#0d7a6e;--on:#fff;--bd:#cbd8e1;--bad:#c33d38;--warn:#9a6a0b;--ok:#1b8a63;color-scheme:light}
[data-board=slate]{--l:#dfe5e8;--d:#6d8796}[data-board=sand]{--l:#ecd9b5;--d:#ae8760}[data-board=moss]{--l:#e5ead3;--d:#789a63}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;line-height:1.15;margin:0 0 .5em;font-weight:600}
h1{font-size:clamp(2rem,5vw,3.4rem)}h2{font-size:1.5rem}h3{font-size:1.1rem}
a{color:var(--ac)}p{margin:.4em 0 .8em}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:18px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--bd)}
.hbar{display:flex;align-items:center;gap:12px;max-width:1120px;margin:0 auto;padding:10px 18px}
.brand{display:flex;align-items:center;gap:9px;font:600 1.25rem Georgia,serif;color:var(--tx);text-decoration:none;margin-right:auto}
.mark{width:22px;height:22px;display:grid;grid-template-columns:1fr 1fr;border-radius:3px;overflow:hidden}.mark i{background:var(--ac)}.mark i:nth-child(2),.mark i:nth-child(3){background:var(--p2)}
nav{display:flex;gap:2px;overflow-x:auto;max-width:1120px;margin:0 auto;padding:0 12px 6px}
nav a{padding:6px 12px;border-radius:8px;color:var(--mu);text-decoration:none;white-space:nowrap}
nav a[aria-current]{background:var(--p2);color:var(--tx)}
body[data-v=l] nav{display:none}
select,input[type=text],input[type=search]{background:var(--p2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;font:inherit}
.btn{background:var(--ac);color:var(--on);border:0;border-radius:8px;padding:9px 16px;font:600 .95rem inherit;cursor:pointer}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.sm{padding:5px 10px;font-size:.85rem}
.demo{background:var(--p2);color:var(--mu);font-size:.85rem;text-align:center;padding:6px 12px}
.card{background:var(--p);border:1px solid var(--bd);border-radius:10px;padding:16px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.big{font:600 2.2rem Georgia,serif}.mu,.note{color:var(--mu);font-size:.88rem}
.tag{display:inline-block;font-size:.75rem;border:1px solid var(--warn);color:var(--warn);border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:36px;align-items:center;padding-top:36px}
.lead{font-size:1.15rem;color:var(--mu);max-width:34em}
.feat{border-left:3px solid var(--ac);padding-left:14px}
.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;width:100%;max-width:560px;container-type:inline-size;border-radius:6px;overflow:hidden;box-shadow:0 10px 30px #0006}
.sq{border:0;padding:0;margin:0;position:relative;display:grid;place-items:center;background:var(--l);cursor:pointer}
.sq.d{background:var(--d)}.sq i{font-style:normal;font-size:11cqw;line-height:1;transition:transform .15s}
.sq i.w{color:#fffdf4;text-shadow:0 0 2px #000,0 1px 1px #000,0 0 3px #000}.sq i.b{color:#161a1e;text-shadow:0 0 1px #fff8}
.sq.last{background-image:linear-gradient(#ffd65e73,#ffd65e73)}.sq.sel{box-shadow:inset 0 0 0 4px #ffd45e}
.sq.tgt::after{content:"";position:absolute;width:28%;height:28%;border-radius:50%;background:#1a283466}
.sq.cap{box-shadow:inset 0 0 0 4px #e5645fcc}.sq.chk{background-image:radial-gradient(circle,#e5645f,#0000 75%)}.sq.hint{box-shadow:inset 0 0 0 4px var(--ac)}
.sq small{display:none;position:absolute;font-size:2.4cqw;line-height:1;opacity:.7;color:#223}.co .sq small{display:block}.sq small.r{top:3px;left:3px}.sq small.f{bottom:3px;right:3px}
.play{display:grid;grid-template-columns:minmax(0,560px) minmax(260px,1fr);gap:20px;align-items:start}
.ml{display:grid;grid-template-columns:34px 1fr 1fr;gap:2px;max-height:240px;overflow:auto;font-size:.95rem}
.ml span{color:var(--mu);padding:3px 4px}.ml button{background:none;border:0;color:var(--tx);text-align:left;padding:3px 6px;border-radius:5px;cursor:pointer;font:inherit}.ml button[aria-current]{background:var(--p2);outline:1px solid var(--ac)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--mu)}
.c-best,.c-excellent{background:var(--ok)}.c-good{background:#7fa6b8}.c-inacc{background:var(--warn)}.c-mistake{background:#e98a4f}.c-blunder{background:var(--bad)}
.clocks{display:flex;gap:10px;margin-bottom:10px}.clocks div{flex:1;background:var(--p2);border-radius:8px;padding:8px 12px;font:600 1.4rem ui-monospace,monospace}
.clocks .on{outline:2px solid var(--ac)}.clocks small{display:block;font:.75rem system-ui;color:var(--mu)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
label{display:block;font-size:.88rem;color:var(--mu);margin:8px 0}label select,label input[type=text]{display:block;width:100%;margin-top:3px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);font-size:.92rem}th{color:var(--mu);font-weight:500}
.bar{height:9px;background:var(--p2);border-radius:5px;overflow:hidden;display:flex}.bar i{display:block;height:100%}
.chat{height:340px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px}
.msg{max-width:85%;padding:9px 12px;border-radius:12px;background:var(--p2)}.msg.u{align-self:flex-end;background:var(--ac);color:var(--on)}
.chip{border:1px solid var(--bd);background:none;color:var(--tx);border-radius:99px;padding:5px 12px;cursor:pointer;font:inherit;font-size:.88rem}.chip[aria-pressed=true]{background:var(--ac);color:var(--on);border-color:var(--ac)}
.chart{width:100%;height:auto}.ev{cursor:pointer}
.av{width:72px;height:72px;border-radius:50%;background:var(--ac);color:var(--on);display:grid;place-items:center;font:600 2rem Georgia}
dialog{background:var(--p);color:var(--tx);border:1px solid var(--bd);border-radius:12px;max-width:380px;width:92%}dialog::backdrop{background:#000a}
dialog .btn{display:block;width:100%;margin:8px 0}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,40px);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:9}#toast.on{opacity:1;transform:translate(-50%,0)}
footer{color:var(--mu);font-size:.85rem;text-align:center;padding:24px 18px}
@media(max-width:820px){.hero,.play{grid-template-columns:1fr}.hero{gap:20px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<dialog id="auth"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

open:[['Develop knights and bishops, fight for the center, castle early.','Every opening move should add a piece to the game or take central space. Avoid early queen trips and pawn grabs, since they cost time. As White, play e4 or d4, develop knights before bishops, and castle within about ten moves.'],['Выводите коней и слонов, боритесь за центр, рокируйтесь раньше.','Каждый ход в дебюте должен вводить фигуру в игру или занимать центр. Не гоняйте ферзя и не хватайте пешки без нужды: это потеря времени. Белыми играйте e4 или d4, выводите коней раньше слонов, рокируйтесь примерно за десять ходов.'],['Аттар мен офицерлерді шығарыңыз, орталық үшін күресіңіз, ерте рокировка жасаңыз.','Ашылудағы әр жүріс фигураны ойынға қосуы немесе орталықты алуы керек. Ферзьді ертерек жүргізбеңіз, пешка жинамаңыз: бұл уақытты жоғалтады. Ақтармен e4 немесе d4 ойнап, аттарды офицерлерден бұрын шығарып, он шақты жүрісте рокировка жасаңыз.']],
tac:[['Look for forks, pins and skewers: one move that attacks two things.','A fork hits two pieces at once, a pin freezes a piece because something worth more stands behind it, and a skewer is a pin in reverse. Each turn, scan checks, captures and threats for both sides. The Training tab has a knight fork to try.'],['Ищите вилки, связки и сквозные удары: один ход, две цели.','Вилка бьёт две фигуры сразу, связка обездвиживает фигуру, за которой стоит более ценная, а сквозной удар — это связка наоборот. На каждом ходу просматривайте шахи, взятия и угрозы обеих сторон. В разделе тренировок есть задача на вилку конём.'],['Айыр, байлау және өтпелі соққыны іздеңіз: бір жүріс, екі нысана.','Айыр екі фигураны бірден соғады, байлау фигураны қозғалтпайды, себебі артында құндырақ фигура тұр, ал өтпелі соққы — кері байлау. Әр жүрісте екі жақтың шахтарын, алуларын және қауіптерін қарап шығыңыз. Жаттығу бөлімінде атпен айыр есебі бар.']],

function Board(el,o={}){
  if(!OK){el.className='';el.innerHTML=`<p class="note">${t('nolib')}</p>`;return{g:null,draw(){}}}
  const b={el,g:o.game||new Chess(o.fen),sel:null,flip:!!o.flip,last:null,hint:o.hint||null,o};
  b.draw=()=>{
    const g=b.g,bd=g.board(),tg=b.sel?g.moves({square:b.sel,verbose:true}).map(m=>m.to):[];
    let ck=null;if(g.in_check())for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=bd[r][c];if(p&&p.type==='k'&&p.color===g.turn())ck='abcdefgh'[c]+(8-r)}
    let h='';
    for(let dr=0;dr<8;dr++)for(let dc=0;dc<8;dc++){
      const r=b.flip?7-dr:dr,c=b.flip?7-dc:dc,sq='abcdefgh'[c]+(8-r),p=bd[r][c];
      let cl='sq '+((r+c)%2?'d':'l');
      if(sq===b.sel)cl+=' sel';if(tg.includes(sq))cl+=p?' cap':' tgt';
      if(b.last&&b.last.includes(sq))cl+=' last';if(sq===ck)cl+=' chk';if(b.hint&&b.hint.includes(sq))cl+=' hint';
      h+=`<button class="${cl}" data-sq="${sq}" aria-label="${sq}${p?' '+(p.color==='w'?'white ':'black ')+p.type:''}">${p?`<i class="${p.color}">${G[p.type.toUpperCase()]}\uFE0E</i>`:''}${dc===0?`<small class="r">${8-r}</small>`:''}${dr===7?`<small class="f">${'abcdefgh'[c]}</small>`:''}</button>`;
    }
    el.className='board'+(S.coords?' co':'');el.innerHTML=h;
  };
  el.onclick=e=>{
    const s=e.target.closest('.sq');if(!s||!o.interactive)return;
    const sq=s.dataset.sq,g=b.g;
    if(b.sel&&g.moves({square:b.sel,verbose:true}).some(m=>m.to===sq)){
      const mv=g.move({from:b.sel,to:sq,promotion:'q'});b.sel=null;b.last=[mv.from,mv.to];b.draw();o.onMove&&o.onMove(mv);return;
    }
    const p=g.get(sq);b.sel=p&&p.color===g.turn()&&(!o.allow||o.allow(p.color))?sq:null;b.draw();
  };
  b.draw();return b;
}

<div class="card"><h3>${t('finc')}</h3>${F.inv.length?F.inv.map(n=>`<p>${fill(t('finvtxt'),n)}</p><div class="row"><button class="btn sm" data-ia="${n}">${t('facc')}</button><button class="btn sm ghost" data-ir="${n}">${t('fdec')}</button></div>`).join(''):`<p class="mu">${t('fnone')}</p>`}</div>
<div class="card"><h3>${t('fsearch')}</h3><input type="search" id="fq" placeholder="${t('fsearch')}" value="${esc(F.q)}" style="width:100%" aria-label="${t('fsearch')}"><div id="fr"></div></div></div></div>`,
()=>{const re=()=>{const q=F.q.toLowerCase();$('#fr').innerHTML=PEOPLE.filter(p=>!F.friends.includes(p[0])&&!F.reqs.includes(p[0])&&p[0].toLowerCase().includes(q)).slice(0,5).map(p=>`<div class="row"><span style="flex:1">${p[0]} <span class="mu">${p[1]}</span></span><button class="btn sm" data-add="${p[0]}"${F.sent[p[0]]?' disabled':''}>${F.sent[p[0]]?t('fsent'):t('fadd')}</button></div>`).join('')||`<p class="mu">${t('fnone')}</p>`;
    $$('[data-add]').forEach(b=>b.onclick=()=>{F.sent[b.dataset.add]=1;toast(t('fsent'));re()})};
  $('#fq').oninput=e=>{F.q=e.target.value;re()};re();
  const on=(a,f)=>$$(`[data-${a}]`).forEach(b=>b.onclick=()=>{f(b.dataset[a]);route()});
  on('i',n=>toast(t('finvsent')));on('a',n=>{F.reqs=F.reqs.filter(x=>x!==n);F.friends.push(n)});on('r',n=>F.reqs=F.reqs.filter(x=>x!==n));
  on('ia',n=>{F.inv=F.inv.filter(x=>x!==n);P=null;pNew();P.mode='friend';location.hash='#/play'});on('ir',n=>F.inv=F.inv.filter(x=>x!==n))}];

V.profile=[()=>`<div class="wrap" style="max-width:760px"><h1>${t('profile')}</h1><div class="card"><div class="row" style="gap:16px"><div class="av" aria-hidden="true">${esc((S.name||'G')[0].toUpperCase())}</div><div><h3 style="margin:0">${esc(S.name)}</h3><p class="mu" style="margin:0">${t('rating')} ${RATING[RATING.length-1]} ${demoTag()} · ${t('style')}: ${t('stylev')} ${demoTag()}</p></div></div><p class="note">${t('pdemo')}</p>
<label>${t('uname')}<input type="text" id="un" maxlength="24" value="${esc(S.name)}"></label>
<div class="grid g2" style="gap:0 14px"><label>${t('lvl')}<select id="sl">${[0,1,2].map(i=>`<option value="${i}"${S.level===i?' selected':''}>${t('lv'+i)}</option>`).join('')}</select></label>
<label>${t('language')}<select id="sg">${[['en','English'],['ru','Русский'],['kk','Қазақша']].map(l=>`<option value="${l[0]}"${lang===l[0]?' selected':''}>${l[1]}</option>`).join('')}</select></label>
<label>${t('theme')}<select id="st"><option value="dark"${S.theme==='dark'?' selected':''}>${t('thd')}</option><option value="light"${S.theme==='light'?' selected':''}>${t('thl')}</option></select></label>
<label>${t('board')}<select id="sb">${[['slate','bslate'],['sand','bsand'],['moss','bmoss']].map(b=>`<option value="${b[0]}"${S.board===b[0]?' selected':''}>${t(b[1])}</option>`).join('')}</select></label></div>
<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="sc"${S.coords?' checked':''}> ${t('coords')}</label><button class="btn" id="sv">${t('saved').replace('.','')}</button></div></div>`,
()=>{$('#sv').onclick=()=>{S.name=($('#un').value.trim()||'Guest').slice(0,24);S.level=+$('#sl').value;S.theme=$('#st').value;S.board=$('#sb').value;S.coords=$('#sc').checked;saveS();applyS();toast(t('saved'));route()};
  $('#sg').onchange=e=>setLang(e.target.value)}];
/* ===== Shell: header, auth dialog, router ===== */
const ROUTES=['dashboard','play','analysis','coach','training','stats','history','friends','profile'];
function shell(){
  $('#hb-bar').innerHTML=`<a class="brand" href="#/"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>ChessSense AI</a><select id="lg" aria-label="${t('language')}">${[['en','EN'],['ru','RU'],['kk','KZ']].map(l=>`<option value="${l[0]}"${lang===l[0]?' selected':''}>${l[1]}</option>`).join('')}</select><button class="btn ghost sm" id="th" aria-label="${t('theme')}">${S.theme==='dark'?'☀':'☾'}</button><button class="btn sm" data-auth>${t('signin')}</button>`;
  $('#nav').innerHTML=ROUTES.map(r=>`<a href="#/${r}" data-r="${r}">${t(r)}</a>`).join('');
  $('#demo').textContent=t('demo');$('#foot').textContent=t('foot');
  $('#lg').onchange=e=>setLang(e.target.value);
  $('#th').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';saveS();applyS();shell();markNav()};
}
function markNav(){const h=location.hash.replace('#/','');$$('#nav a').forEach(a=>a.toggleAttribute('aria-current',a.dataset.r===h))}
function setLang(l){lang=l;st.set('lang',l);applyS();shell();route()}
function route(){
  clearInterval(tick);const h=location.hash.replace('#/',''),v=V[h]&&h!=='landing'?h:'landing';
  try{$('#app').innerHTML=V[v][0]();document.body.dataset.v=v==='landing'?'l':'a';markNav();V[v][1]&&V[v][1]()}
  catch(e){console.error(e);$('#app').innerHTML=`<div class="wrap"><p class="note">${esc(e.message)}</p></div>`}
}
function openAuth(){const d=$('#auth');d.innerHTML=`<h2>${t('ah')}</h2><button class="btn ghost" data-na>${t('google')}</button><button class="btn ghost" data-na>${t('email')}</button><button class="btn ghost" data-na>${t('apple')}</button><button class="btn" data-guest>${t('guest')}</button><p class="note">${t('anote')}</p><button class="btn ghost sm" data-x>${t('close')}</button>`;
  d.showModal?d.showModal():d.setAttribute('open','')}
document.addEventListener('click',e=>{const x=e.target.closest('[data-go],[data-auth],[data-na],[data-guest],[data-x]');if(!x)return;
  if(x.dataset.go){location.hash='#/'+x.dataset.go}
  else if('auth' in x.dataset)openAuth();
  else if('na' in x.dataset)toast(t('anot2'));
  else{const d=$('#auth');d.close?d.close():d.removeAttribute('open');if('guest' in x.dataset)location.hash='#/dashboard'}});
addEventListener('hashchange',route);
applyS();shell();route();
</script>
</body>
</html>
